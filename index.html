<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 位址檢測工具 | IP Address Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
        }

        .search-section {
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-box input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1em;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .search-box input:focus {
            border-color: rgba(255,255,255,0.6);
        }

        .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .search-box button:hover {
            background: rgba(255,255,255,0.35);
        }

        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-box .my-ip-btn {
            background: rgba(40,167,69,0.4);
        }

        .search-box .my-ip-btn:hover {
            background: rgba(40,167,69,0.6);
        }

        .ip-type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 700;
            margin-left: 8px;
            vertical-align: middle;
        }

        .badge-v4 {
            background: #28a745;
            color: white;
        }

        .badge-v6 {
            background: #6f42c1;
            color: white;
        }

        .query-info {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 8px;
            font-size: 0.9em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-title {
            color: white;
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .ip-box {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ip-label {
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            min-width: 60px;
        }

        .ip-value {
            color: white;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-color: rgba(255,255,255,0.5);
            flex: 1;
            word-break: break-all;
        }

        .ip-value.not-detected {
            opacity: 0.5;
            text-decoration: none;
        }

        .copy-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .copy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .copy-btn.copied {
            background: #28a745;
        }

        #map {
            height: 250px;
            border-radius: 10px;
            overflow: hidden;
        }

        .info-grid {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 20px;
        }

        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: rgba(255,255,255,0.7);
            min-width: 100px;
            font-weight: 500;
        }

        .info-value {
            color: white;
            flex: 1;
        }

        .alert-box {
            background: rgba(255,193,7,0.2);
            border: 1px solid rgba(255,193,7,0.5);
            border-radius: 10px;
            padding: 15px 20px;
            margin-top: 20px;
            text-align: center;
            color: #ffc107;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: rgba(220,53,69,0.2);
            border: 1px solid rgba(220,53,69,0.5);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
            color: #ff6b6b;
            font-weight: 600;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-top: 30px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .ip-value {
                font-size: 1em;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 IP 位址檢測工具</h1>
            <p>檢測 IPv4/IPv6 位址與地理位置資訊</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="ipInput" placeholder="輸入 IP 位址查詢（例：8.8.8.8 或 2001:4860:4860::8888）"
                       onkeydown="if(event.key==='Enter') lookupIP()">
                <button onclick="lookupIP()" id="lookupBtn">查詢</button>
                <button class="my-ip-btn" onclick="lookupMyIP()">我的 IP</button>
            </div>
            <div class="query-info" id="queryInfo"></div>
        </div>

        <div id="loadingSection" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>正在查詢 IP 資訊...</p>
        </div>

        <div id="errorSection" style="display: none;"></div>

        <div id="resultSection" style="display: none;">
            <div class="main-content">
                <div class="card">
                    <div class="card-title">IP 位址：</div>

                    <div class="ip-box" id="ipv4Box">
                        <span class="ip-label">IPv4:</span>
                        <span class="ip-type-badge badge-v4" style="font-size:0.65em">v4</span>
                        <span class="ip-value" id="ipv4">-</span>
                        <button class="copy-btn" onclick="copyToClipboard('ipv4')" title="複製 IP">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="ip-box" id="ipv6Box">
                        <span class="ip-label">IPv6:</span>
                        <span class="ip-type-badge badge-v6" style="font-size:0.65em">v6</span>
                        <span class="ip-value not-detected" id="ipv6">未偵測到</span>
                        <button class="copy-btn" onclick="copyToClipboard('ipv6')" title="複製 IP" disabled id="ipv6CopyBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="ip-box" id="queryIpBox" style="display:none">
                        <span class="ip-label" id="queryIpLabel">IP:</span>
                        <span class="ip-type-badge" id="queryIpBadge"></span>
                        <span class="ip-value" id="queryIpAddr">-</span>
                        <button class="copy-btn" onclick="copyToClipboard('queryIpAddr')" title="複製 IP">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div id="map"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">IP 資訊：</div>

                <div class="info-grid">
                    <div class="info-row">
                        <span class="info-label">IP 版本:</span>
                        <span class="info-value" id="ipVersion">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">ISP:</span>
                        <span class="info-value" id="isp">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">城市:</span>
                        <span class="info-value" id="city">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">區域:</span>
                        <span class="info-value" id="region">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">國家:</span>
                        <span class="info-value" id="country">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">時區:</span>
                        <span class="info-value" id="timezone">-</span>
                    </div>
                    <div class="info-row" id="vpnRow" style="display: none;">
                        <span class="info-label">VPN 偵測:</span>
                        <span class="info-value" id="vpnStatus">-</span>
                    </div>
                </div>

                <div class="alert-box" id="alertBox" style="display: none;">
                    ⚠️ 您的位置資訊可能會被暴露！
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 IP Checker | 使用 ipapi.co API</p>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let marker = null;

        function detectIPVersion(ip) {
            if (ip.includes(':')) return 'IPv6';
            if (/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return 'IPv4';
            return null;
        }

        function isValidIP(ip) {
            if (/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
                return ip.split('.').every(n => parseInt(n) >= 0 && parseInt(n) <= 255);
            }
            if (ip.includes(':')) {
                return /^([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4}$/.test(ip) ||
                       /^::$/.test(ip) ||
                       /^([0-9a-fA-F]{1,4}:){1,7}:$/.test(ip) ||
                       /^::[0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4}){0,5}$/.test(ip) ||
                       /^[0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4}){7}$/.test(ip);
            }
            return false;
        }

        function lookupIP() {
            const input = document.getElementById('ipInput').value.trim();
            if (!input) { lookupMyIP(); return; }
            if (!isValidIP(input)) {
                showError('無效的 IP 格式，請輸入正確的 IPv4 或 IPv6 位址');
                return;
            }
            getIPInfo(input);
        }

        function lookupMyIP() {
            document.getElementById('ipInput').value = '';
            getIPInfo(null);
        }

        function showError(msg) {
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'block';
            document.getElementById('errorSection').innerHTML = `<div class="error-box">${msg}</div>`;
        }

        async function getIPInfo(queryIP) {
            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'none';
            document.getElementById('lookupBtn').disabled = true;

            const isMyIP = !queryIP;

            try {
                const url = queryIP
                    ? `https://ipapi.co/${queryIP}/json/`
                    : 'https://ipapi.co/json/';
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    showError(`查詢失敗: ${data.reason || data.message || '未知錯誤'}`);
                    return;
                }

                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('resultSection').style.display = 'block';

                if (isMyIP) {
                    document.getElementById('ipv4Box').style.display = 'flex';
                    document.getElementById('ipv6Box').style.display = 'flex';
                    document.getElementById('queryIpBox').style.display = 'none';

                    const mainIP = data.ip || '無法獲取';
                    const mainVersion = data.version || detectIPVersion(mainIP);

                    if (mainVersion === 'IPv6') {
                        document.getElementById('ipv6').textContent = mainIP;
                        document.getElementById('ipv6').classList.remove('not-detected');
                        document.getElementById('ipv6CopyBtn').disabled = false;
                        document.getElementById('ipv4').textContent = '偵測中...';
                    } else {
                        document.getElementById('ipv4').textContent = mainIP;
                        document.getElementById('ipv4').classList.remove('not-detected');
                    }

                    try {
                        if (mainVersion === 'IPv6') {
                            const v4Resp = await fetch('https://api4.ipify.org?format=json');
                            const v4Data = await v4Resp.json();
                            document.getElementById('ipv4').textContent = v4Data.ip;
                            document.getElementById('ipv4').classList.remove('not-detected');
                        } else {
                            const controller = new AbortController();
                            setTimeout(() => controller.abort(), 3000);
                            const v6Resp = await fetch('https://api6.ipify.org?format=json', { signal: controller.signal });
                            const v6Data = await v6Resp.json();
                            if (v6Data.ip && v6Data.ip.includes(':')) {
                                document.getElementById('ipv6').textContent = v6Data.ip;
                                document.getElementById('ipv6').classList.remove('not-detected');
                                document.getElementById('ipv6CopyBtn').disabled = false;
                            }
                        }
                    } catch (e) {
                        if (mainVersion !== 'IPv6') {
                            document.getElementById('ipv6').textContent = '未偵測到（網路不支援 IPv6）';
                        } else {
                            document.getElementById('ipv4').textContent = '未偵測到';
                        }
                    }

                    document.getElementById('queryInfo').textContent = '顯示您目前的 IP 資訊';
                    document.getElementById('ipVersion').textContent = mainVersion || '未知';

                } else {
                    document.getElementById('ipv4Box').style.display = 'none';
                    document.getElementById('ipv6Box').style.display = 'none';
                    document.getElementById('queryIpBox').style.display = 'flex';

                    const ip = data.ip || queryIP;
                    const version = data.version || detectIPVersion(ip);
                    document.getElementById('queryIpAddr').textContent = ip;
                    document.getElementById('queryIpLabel').textContent = version ? `${version}:` : 'IP:';
                    const badge = document.getElementById('queryIpBadge');
                    badge.textContent = version || 'IP';
                    badge.className = 'ip-type-badge ' + (version === 'IPv6' ? 'badge-v6' : 'badge-v4');

                    document.getElementById('queryInfo').textContent = `查詢 IP: ${ip}`;
                    document.getElementById('ipVersion').textContent = version || '未知';
                }

                document.getElementById('isp').textContent = data.org || data.asn || '未知';
                document.getElementById('city').textContent = data.city || '未知';
                document.getElementById('region').textContent = data.region || '未知';
                document.getElementById('country').textContent = data.country_name || data.country || '未知';
                document.getElementById('timezone').textContent = data.timezone || '未知';

                if (isMyIP) {
                    detectVPN(data, Intl.DateTimeFormat().resolvedOptions().timeZone);
                    document.getElementById('alertBox').style.display = 'block';
                } else {
                    document.getElementById('vpnRow').style.display = 'none';
                    document.getElementById('alertBox').style.display = 'none';
                }

                initMap(data.latitude, data.longitude, data.city);

            } catch (error) {
                showError(`查詢失敗: ${error.message}`);
            } finally {
                document.getElementById('lookupBtn').disabled = false;
            }
        }

        function initMap(lat, lon, city) {
            if (map) { map.remove(); map = null; }
            if (!lat || !lon) {
                document.getElementById('map').innerHTML = '<div style="text-align: center; padding: 100px 20px; color: rgba(255,255,255,0.7);">無法獲取位置資訊</div>';
                return;
            }
            map = L.map('map', { zoomControl: false }).setView([lat, lon], 13);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            marker = L.marker([lat, lon]).addTo(map);
            marker.bindPopup(`<b>IP 位置</b><br>${city || '未知位置'}`).openPopup();
        }

        document.addEventListener('DOMContentLoaded', () => lookupMyIP());

        function detectVPN(data, browserTimezone) {
            const vpnRow = document.getElementById('vpnRow');
            const vpnStatus = document.getElementById('vpnStatus');
            let vpnScore = 0;
            let reasons = [];

            if (data.timezone && browserTimezone) {
                const ipTz = data.timezone.toLowerCase();
                const browserTz = browserTimezone.toLowerCase();
                if (ipTz !== browserTz && !browserTz.includes(ipTz.split('/')[0])) {
                    vpnScore += 40;
                    reasons.push('時區不符');
                }
            }

            const isp = (data.org || data.asn || '').toLowerCase();
            const vpnKeywords = ['vpn','proxy','hosting','datacenter','cloudflare','amazon','google','microsoft','digitalocean','linode','vultr','ovh','hetzner','alibaba','tencent','baidu','contabo','scaleway','aws','azure','gcp','oracle','ibm'];
            for (const kw of vpnKeywords) {
                if (isp.includes(kw)) { vpnScore += 35; reasons.push('資料中心 IP'); break; }
            }

            const vpnProviders = ['nordvpn','expressvpn','surfshark','cyberghost','pia','protonvpn','tunnelbear','windscribe','hide.me','ipvanish','strongvpn','vyprvpn'];
            for (const p of vpnProviders) {
                if (isp.includes(p)) { vpnScore += 50; reasons.push('VPN 服務商'); break; }
            }

            vpnRow.style.display = 'flex';
            if (vpnScore >= 50) {
                vpnStatus.innerHTML = `<strong style="color:#ff6b6b">可能使用 VPN</strong> (${reasons.join(', ')})`;
            } else if (vpnScore >= 25) {
                vpnStatus.innerHTML = `<strong style="color:#ffd93d">疑似使用 VPN</strong> (${reasons.join(', ')})`;
            } else {
                vpnStatus.innerHTML = `<strong style="color:#6bcf7f">未偵測到 VPN</strong>`;
            }
        }

        async function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            const btn = element.parentElement.querySelector('.copy-btn');
            if (!text || text === '-' || text.includes('未偵測') || text.includes('偵測中')) return;

            try {
                await navigator.clipboard.writeText(text);
                const originalHTML = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = originalHTML; }, 2000);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
        }
    </script>
</body>
</html>
