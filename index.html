<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 位址檢測工具 | IP Address Checker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .card-title {
            color: white;
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .ip-box {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .ip-label {
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            min-width: 60px;
        }
        
        .ip-value {
            color: white;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-color: rgba(255,255,255,0.5);
            flex: 1;
        }
        
        .ip-value.not-detected {
            opacity: 0.5;
            text-decoration: none;
        }
        
        .help-icon {
            width: 20px;
            height: 20px;
            background: #17a2b8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            cursor: help;
        }
        
        #map {
            height: 250px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .info-section {
            margin-top: 20px;
        }
        
        .info-grid {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 20px;
        }
        
        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: rgba(255,255,255,0.7);
            min-width: 100px;
            font-weight: 500;
        }
        
        .info-value {
            color: white;
            flex: 1;
        }
        
        .alert-box {
            background: rgba(255,193,7,0.2);
            border: 1px solid rgba(255,193,7,0.5);
            border-radius: 10px;
            padding: 15px 20px;
            margin-top: 20px;
            text-align: center;
            color: #ffc107;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            color: white;
            padding: 40px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        footer {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-top: 30px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
            
            .ip-value {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 IP 位址檢測工具</h1>
            <p>檢測您的 IPv4/IPv6 位址與地理位置資訊</p>
        </header>
        
        <div id="loadingSection" class="loading">
            <div class="loading-spinner"></div>
            <p>正在檢測您的 IP 位址...</p>
        </div>
        
        <div id="resultSection" style="display: none;">
            <div class="main-content">
                <div class="card">
                    <div class="card-title">我的 IP 位址：</div>
                    
                    <div class="ip-box">
                        <span class="ip-label">IPv4:</span>
                        <span class="help-icon" title="Internet Protocol version 4">?</span>
                        <span class="ip-value" id="ipv4">檢測中...</span>
                    </div>
                    
                    <div class="ip-box">
                        <span class="ip-label">IPv6:</span>
                        <span class="help-icon" title="Internet Protocol version 6">?</span>
                        <span class="ip-value not-detected" id="ipv6">未檢測到</span>
                    </div>
                </div>
                
                <div class="card">
                    <div id="map"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">我的 IP 資訊：</div>
                
                <div class="info-grid">
                    <div class="info-row">
                        <span class="info-label">ISP:</span>
                        <span class="info-value" id="isp">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">城市:</span>
                        <span class="info-value" id="city">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">區域:</span>
                        <span class="info-value" id="region">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">國家:</span>
                        <span class="info-value" id="country">-</span>
                    </div>
                </div>
                
                <div class="alert-box">
                    ⚠️ 您的位置資訊可能會被暴露！
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2026 IP Checker | 純前端檢測，使用 ipapi.co API</p>
        </footer>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let marker = null;
        
        async function getIPInfo() {
            try {
                // 使用 ipapi.co 獲取 IP 資訊
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                // 顯示結果
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('resultSection').style.display = 'block';
                
                // IP 位址
                document.getElementById('ipv4').textContent = data.ip || '無法獲取';
                
                // IP 資訊
                document.getElementById('isp').textContent = data.org || data.asn || '未知';
                document.getElementById('city').textContent = data.city || '未知';
                document.getElementById('region').textContent = data.region || '未知';
                document.getElementById('country').textContent = data.country_name || data.country || '未知';
                
                // 初始化地圖
                initMap(data.latitude, data.longitude, data.city);
                
            } catch (error) {
                console.error('獲取 IP 資訊失敗:', error);
                document.getElementById('loadingSection').innerHTML = `
                    <p style="color: #ffc107;">⚠️ 無法獲取 IP 資訊，請檢查網路連線</p>
                    <p style="font-size: 14px; opacity: 0.7;">${error.message}</p>
                `;
            }
        }
        
        function initMap(lat, lon, city) {
            if (!lat || !lon) {
                document.getElementById('map').innerHTML = '<div style="text-align: center; padding: 100px 20px; color: rgba(255,255,255,0.7);">無法獲取位置資訊</div>';
                return;
            }
            
            // 創建地圖
            map = L.map('map', {
                zoomControl: false
            }).setView([lat, lon], 13);
            
            // 添加縮放控件到右上角
            L.control.zoom({
                position: 'topright'
            }).addTo(map);
            
            // 添加 OpenStreetMap 圖層
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            // 添加標記
            marker = L.marker([lat, lon]).addTo(map);
            marker.bindPopup(`<b>您的位置</b><br>${city || '未知位置'}`).openPopup();
        }
        
        // 頁面載入後開始檢測
        document.addEventListener('DOMContentLoaded', getIPInfo);
    </script>
</body>
</html>
